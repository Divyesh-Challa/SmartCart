# Render blueprint: one web service that runs the API and serves the web app.
# Secrets are set in the Render dashboard (sync: false), never in this file.
services:
  - type: web
    name: smartcart-app
    runtime: docker
    plan: free
    # Virginia is Render's closest region to the Supabase database (Montreal).
    region: virginia
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: SMARTCART_ENVIRONMENT
        value: production
      # Free plan has no background workers, so the weekly sync runs in the web
      # process. Keep the service at one instance while this is true.
      - key: SMARTCART_RUN_SCHEDULER
        value: "true"
      - key: SMARTCART_DATABASE_URL
        sync: false
      - key: SMARTCART_SUPABASE_URL
        sync: false
      - key: SMARTCART_SUPABASE_ANON_KEY
        sync: false
      - key: SMARTCART_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMARTCART_ADMIN_EMAILS
        sync: false
      - key: SMARTCART_ADMIN_TOKEN
        sync: false
      - key: SMARTCART_SENTRY_DSN
        sync: false
      # The web app is served from the same origin, so CORS only matters for
      # other clients. JSON list, e.g. ["https://smartcart-app.onrender.com"].
      - key: SMARTCART_CORS_ORIGINS
        sync: false
